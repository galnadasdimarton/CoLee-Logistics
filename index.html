<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sofőr lap</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1d1f">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sofőr lap">
<style>
  :root{
    --bg:#1c1d1f;
    --card:#26272a;
    --card-2:#2e2f33;
    --line:#3a3b3f;
    --accent:#5b9bd5;
    --text:#eceeef;
    --text-dim:#9a9ca0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 0 40px;}

  /* driver picker */
  #picker{padding:32px 20px;}
  #picker h1{font-size:18px;font-weight:700;margin:0 0 4px;}
  #picker p{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  #picker .name-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    font-size:16px;
    font-weight:600;
    margin-bottom:10px;
    cursor:pointer;
  }
  #picker .name-btn:active{background:var(--card-2);}

  /* switch-driver link */
  .switch-row{padding:10px 16px 0;}
  .switch-row button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12.5px;
    padding:4px 0;
    cursor:pointer;
    text-decoration:underline;
  }

  .head{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:relative;}
  .head .logo{position:absolute;top:14px;right:16px;height:26px;width:auto;filter:invert(1);mix-blend-mode:screen;}
  .head .tour{padding-right:96px;font-weight:700;font-size:18px;outline:none;line-height:1.2;}
  .head .sub{margin-top:4px;font-size:13px;color:var(--text-dim);}
  .head .sub span{outline:none;}

  .meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);}
  .meta .cell{padding:10px 16px;}
  .meta .cell:first-child{border-right:1px solid var(--line);}
  .meta label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:2px;}
  .meta div[contenteditable]{font-size:15px;font-weight:600;outline:none;}

  h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:20px 16px 8px;}

  .route{margin:0 16px;position:relative;padding-left:16px;}
  .route::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .stop{position:relative;padding:0 22px 16px 12px;}
  .stop:last-child{padding-bottom:2px;}
  .stop::before{content:"";position:absolute;left:-16px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .stop .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;position:relative;}
  .stop .time{font-size:15px;font-weight:700;color:var(--text);outline:none;white-space:nowrap;}
  .stop .place{font-size:14.5px;font-weight:600;outline:none;flex:1;}
  .stop .addr{font-size:12.5px;color:var(--text-dim);margin-top:2px;outline:none;}
  .stop .del{position:absolute;right:-6px;top:-4px;}
  .add-stop{margin:4px 0 0 -6px;background:none;border:none;color:var(--text-dim);font-size:12.5px;padding:6px;cursor:pointer;}
  .add-stop:hover{color:var(--accent);}

  .load{margin:0 16px;}
  .load-group{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative;}
  .load-group .gname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);margin-bottom:6px;outline:none;}
  .load-group .del{position:absolute;right:8px;top:8px;}
  .item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-top:1px solid var(--card-2);font-size:14.5px;}
  .item:first-of-type{border-top:none;}
  .item .box{width:17px;height:17px;border:2px solid var(--text-dim);border-radius:4px;flex:none;margin-top:1px;}
  .item .box.checked{background:var(--accent);border-color:var(--accent);}
  .item span{outline:none;flex:1;}
  .item .del{margin-left:auto;}
  .add-item{background:none;border:none;color:var(--text-dim);font-size:12.5px;padding:4px 0 0;cursor:pointer;}
  .add-item:hover{color:var(--accent);}

  .del{background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;padding:2px 4px;cursor:pointer;flex:none;}
  .del:hover{color:#e5484d;}

  .issues{margin:20px 16px 0;background:var(--card);border-radius:8px;padding:10px 12px;min-height:46px;font-size:14px;}
  .issues label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:4px;}
  .issues div{outline:none;color:var(--text-dim);}

  .toolbar{max-width:480px;margin:16px auto 0;display:flex;gap:10px;padding:0 16px;}
  .toolbar button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;}
  .toolbar button:active{background:var(--card-2);}

  @media print{
    body{background:#fff;color:#000;}
    .toolbar,.switch-row{display:none;}
    .wrap{max-width:100%;}
    .head{border-bottom-color:#ddd;}
    .meta{border-bottom-color:#ddd;}
    .meta .cell:first-child{border-right-color:#ddd;}
    .load-group,.issues{background:#f4f4f4 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .add-stop,.add-item,.del{display:none;}
  }
</style>
</head>

<div class="wrap" id="wrap"></div>

<script>
function renderPicker(){
  const wrap = document.getElementById('wrap');
  const names = Object.keys(DATA);
  wrap.innerHTML = `
    <div id="picker">
      <h1>Ki vagy?</h1>
      <p>Válaszd ki a neved a napi itinered megtekintéséhez.</p>
      ${names.map(k => `<button class="name-btn" data-key="${k}">${DATA[k].driver}</button>`).join('')}
    </div>
  `;
  wrap.querySelectorAll('.name-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      localStorage.setItem('sofor_key', btn.dataset.key);
      renderSheet(btn.dataset.key);
    });
  });
}

function renderSheet(key){
  const d = DATA[key];
  if(!d){ renderPicker(); return; }
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <div class="switch-row"><button id="switchBtn">Nem ${d.driver} vagy? Válts sofőrt</button></div>
    <div class="head">
      <img class="logo" src="data:image/png;base64,${LOGO_B64}" alt="Co Lee logo">
      <div class="tour" contenteditable="true">${d.tour}</div>
      <div class="sub"><span contenteditable="true">${d.date}</span></div>
    </div>
    <div class="meta">
      <div class="cell"><label>Sofőr</label><div contenteditable="true">${d.driver}</div></div>
      <div class="cell"><label>Jármű</label><div contenteditable="true">${d.vehicle}</div></div>
    </div>
    <h2>Menetrend</h2>
    <div class="route" id="route">
      ${d.stops.map(s => stopHtml(s)).join('')}
    </div>
    <button class="add-stop" onclick="addStop()">+ új megálló</button>
    <h2>Rakomány / Emberkék</h2>
    <div class="load" id="load">
      ${d.loadGroups.map(g => groupHtml(g)).join('')}
    </div>
    <div class="issues">
      <label>Problémák / eltérések</label>
      <div contenteditable="true" data-placeholder="Még nincs — írd ide, ha valami hiányzik, sérült vagy késik"></div>
    </div>
    <div class="toolbar">
      <button onclick="window.print()">Nyomtatás / PDF mentése</button>
      <button onclick="addGroup()">+ új rakomány csoport</button>
    </div>
  `;
  document.getElementById('switchBtn').addEventListener('click', ()=>{
    localStorage.removeItem('sofor_key');
    renderPicker();
  });
}

function stopHtml(s){
  return `<div class="stop">
    <div class="row1">
      <div class="time" contenteditable="true">${s.time}</div>
      <div class="place" contenteditable="true">${s.place}</div>
      <button class="del" onclick="removeEl(this)" aria-label="törlés">×</button>
    </div>
    <div class="addr" contenteditable="true">${s.addr}</div>
  </div>`;
}
function itemHtml(it){
  return `<div class="item"><div class="box${it.checked ? ' checked':''}" onclick="this.classList.toggle('checked')"></div><span contenteditable="true">${it.text}</span><button class="del" onclick="removeEl(this)" aria-label="törlés">×</button></div>`;
}
function groupHtml(g){
  return `<div class="load-group">
    <div class="gname" contenteditable="true">${g.name}</div>
    <button class="del" onclick="removeEl(this)" aria-label="csoport törlése">×</button>
    ${g.items.map(itemHtml).join('')}
    <button class="add-item" onclick="addItem(this)">+ új tétel</button>
  </div>`;
}

function addStop(){
  const route = document.getElementById('route');
  const stop = document.createElement('div');
  stop.className = 'stop';
  stop.innerHTML = '<div class="row1"><div class="time" contenteditable="true">00:00</div><div class="place" contenteditable="true">Új megálló</div><button class="del" onclick="removeEl(this)" aria-label="törlés">×</button></div><div class="addr" contenteditable="true">Cím</div>';
  route.appendChild(stop);
}
function addItem(btn){
  const item = document.createElement('div');
  item.className = 'item';
  item.innerHTML = '<div class="box" onclick="this.classList.toggle(\'checked\')"></div><span contenteditable="true">Új tétel</span><button class="del" onclick="removeEl(this)" aria-label="törlés">×</button>';
  btn.parentElement.insertBefore(item, btn);
}
function addGroup(){
  const load = document.getElementById('load');
  const group = document.createElement('div');
  group.className = 'load-group';
  group.innerHTML = '<div class="gname" contenteditable="true">Új csoport</div><button class="del" onclick="removeEl(this)" aria-label="csoport törlése">×</button><button class="add-item" onclick="addItem(this)">+ új tétel</button>';
  load.appendChild(group);
}
function removeEl(btn){
  btn.closest('.stop, .item, .load-group').remove();
}

// boot
const saved = localStorage.getItem('sofor_key');
if(saved && DATA[saved]){
  renderSheet(saved);
} else {
  renderPicker();
}
</script>
</body>
